; Monav Display — firmware for the round in-car display that shows what the
; Monav iPhone app computes. See ../README.md and ../PROTOCOL.md.

[platformio]
default_envs = amoled175

; Waveshare ESP32-S3-Touch-AMOLED-1.75 — 1.75" round CO5300 AMOLED (466×466,
; QSPI) with CST9217 touch. ESP32-S3R8: 16 MB flash, 8 MB octal PSRAM.
; Bring-up settings taken over from plane-radar-amoled (known good on this board).
[env:amoled175]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions/monav_16mb.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

board_build.embed_files =
  data/fonts/speed.vlw
  data/fonts/speed_xl.vlw
  data/fonts/speed_md.vlw
  data/fonts/num.vlw
  data/fonts/num_sm.vlw
  data/fonts/sign_lg.vlw
  data/fonts/sign_md.vlw
  data/fonts/sign_sm.vlw
  data/fonts/sign_xs.vlw
  data/fonts/title.vlw
  data/fonts/label.vlw
  data/fonts/body.vlw
  data/fonts/small.vlw
  data/fonts/clock.vlw
  data/fonts/tiny.vlw

; The Arduino framework appends -std=gnu++11 and -Os after build_flags, so unflag them (with
; -Os the per-pixel drawing loops ran at about half speed).
build_unflags =
  -std=gnu++11
  -Os

build_flags =
  -std=gnu++17
  -O2
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_AMOLED_175
  -DBOARD_HAS_PSRAM
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=6144
  -DARDUINOJSON_USE_LONG_LONG=1

lib_deps =
  lovyan03/LovyanGFX@1.2.28
  h2zero/NimBLE-Arduino@1.4.3
  bblanchon/ArduinoJson@^7.4.2
  lewisxhe/SensorLib@0.3.4

; --- Development only: never ship these -------------------------------------------------------
; amoled175-dev: additionally accepts the test client's token (tools/ble) without touching the
; pairing, honours {"t":"dev","layout":…}, and advertises from a random static address so the
; paired iPhone's pending connection does not grab it while the Mac is testing.
[env:amoled175-dev]
extends = env:amoled175
build_flags =
  ${env:amoled175.build_flags}
  -DMONAV_DEV_TOKEN=\"monav-dev-token\"
  -DMONAV_DEV_RANDOM_ADDR

; amoled175-demo: a scripted drive with an embedded sample map, BLE off - for measuring frame
; times in every layout on the board.
[env:amoled175-demo]
extends = env:amoled175
build_flags =
  ${env:amoled175.build_flags}
  -DMONAV_DEV_TOKEN=\"monav-dev-token\"
  -DMONAV_DEMO
board_build.embed_files =
  ${env:amoled175.board_build.embed_files}
  tools/preview/maps/sample-berliner-allee.jpg

; amoled175-crashtest: the dev build, but it aborts 6 s after boot - flashed over the air to see
; the bootloader roll back to the previous firmware.
[env:amoled175-crashtest]
extends = env:amoled175-dev
build_flags =
  ${env:amoled175-dev.build_flags}
  -DMONAV_CRASH_TEST

; Development only: the dev build, but its ui task hangs 6 s after boot - sent over the air, it shows
; the task watchdog resetting it and the bootloader rolling back.
[env:amoled175-hangtest]
extends = env:amoled175-dev
build_flags =
  ${env:amoled175-dev.build_flags}
  -DMONAV_HANG_TEST
